<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="100%" height="100%">
  <defs>
    <!-- Metallic gradient for ICP letters -->
    <linearGradient id="icpGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#d4f3ed" />
      <stop offset="70%" stop-color="#64c9bb" />
      <stop offset="100%" stop-color="#1b5a9a" />
    </linearGradient>

    <!-- Rich Navy Blue Badge -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143c72" />
      <stop offset="100%" stop-color="#0b2447" />
    </linearGradient>

    <!-- Subtle drop shadow -->
    <filter id="badgeShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Clean Royal Blue Emblem Box -->
  <rect x="8" y="6" width="344" height="78" rx="10" ry="10" fill="url(#badgeGrad)" stroke="#2b5f9e" stroke-width="1" filter="url(#badgeShadow)" />

  <!-- Logo Graphics Group -->
  <g transform="translate(18, 12)">
    <!-- Syringe Graphic aligned above/into letter C -->
    <g transform="translate(96, 2)">
      <!-- Plunger & Top Thumb Ring -->
      <rect x="18" y="1" width="8" height="2" rx="0.5" fill="#ffffff" />
      <rect x="21" y="3" width="2" height="6" fill="#ffffff" />
      <rect x="16" y="9" width="12" height="2" rx="0.5" fill="#ffffff" />
      <!-- Syringe Glass Barrel with liquid level -->
      <rect x="18" y="11" width="8" height="18" rx="0.5" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1" />
      <rect x="19" y="16" width="6" height="5" fill="#ffffff" />
      <!-- Graduation ticks -->
      <line x1="19" y1="14" x2="22" y2="14" stroke="#ffffff" stroke-width="0.8" />
      <line x1="19" y1="18" x2="22" y2="18" stroke="#ffffff" stroke-width="0.8" />
      <line x1="19" y1="22" x2="22" y2="22" stroke="#ffffff" stroke-width="0.8" />
      <line x1="19" y1="26" x2="22" y2="26" stroke="#ffffff" stroke-width="0.8" />
      <!-- Needle & Nozzle -->
      <polygon points="20,29 24,29 23,33 21,33" fill="#ffffff" />
      <line x1="22" y1="33" x2="22" y2="44" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
      <!-- Drop / Vial tip -->
      <circle cx="22" cy="46" r="2" fill="#ffffff" />
    </g>

    <!-- ICP Letters -->
    <!-- I -->
    <text x="50" y="46" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold" font-size="44" fill="url(#icpGrad)" text-anchor="middle">I</text>
    
    <!-- C -->
    <text x="118" y="46" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold" font-size="44" fill="url(#icpGrad)" text-anchor="middle">C</text>
    
    <!-- P -->
    <text x="184" y="46" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-weight="bold" font-size="44" fill="url(#icpGrad)" text-anchor="middle">P</text>

    <!-- Company Name under ICP -->
    <text x="160" y="64" font-family="'Arial', 'Liberation Sans', sans-serif" font-weight="bold" font-size="10.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.6">
      INJECT CARE PARENTERALS PVT. LTD.
    </text>
  </g>

  <!-- Tagline underneath the blue badge -->
  <text x="180" y="102" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-style="italic" font-weight="bold" font-size="12.5" fill="#143c72" text-anchor="middle" letter-spacing="0.3">
    A Partner for the Quality Conscious
  </text>
</svg>
